services:
  # ─── MongoDB ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: smart-ai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ─── Backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: smart-ai-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smart-ai-chat
      - JWT_SECRET=${JWT_SECRET:-smart-ai-jwt-secret-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=http://localhost:80,http://localhost
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: smart-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  backend-uploads:
