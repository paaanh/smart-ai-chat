services:
  # ─── MongoDB ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ─── Backend (Chat API + Socket.io) ───────────────────────────────────
  backend:
    build: ./smart-ai/backend
    env_file:
      - ./smart-ai/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smart-ai-chat
      - JWT_SECRET=${JWT_SECRET:-smart-ai-jwt-secret-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - METERED_API_KEY=${METERED_API_KEY:-}
      - METERED_DOMAIN=${METERED_DOMAIN:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  # ─── SkyOffice Game Server (Colyseus 0.14) ────────────────────────────
  skyoffice-server:
    build:
      context: ./SkyOffice
      dockerfile: Dockerfile.server
    ports:
      - "2567:2567"
    environment:
      - PORT=2567
      - NODE_ENV=production
    restart: unless-stopped

  # ─── SkyOffice Client (Phaser + React, served by Nginx) ───────────────
  skyoffice-client:
    build:
      context: ./SkyOffice
      dockerfile: Dockerfile.client
      args:
        # Connect browser client directly to Colyseus server
        - VITE_SERVER_URL=ws://localhost:2567
    ports:
      - "3000:80"
    depends_on:
      - skyoffice-server
    restart: unless-stopped

  # ─── Frontend (Chat App) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./smart-ai/frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        # URL of SkyOffice client; used by the /office iframe
        - VITE_SKYOFFICE_URL=${VITE_SKYOFFICE_URL:-http://localhost:3000}
    ports:
      - "80:80"
    depends_on:
      - backend
      - skyoffice-client
    restart: unless-stopped

volumes:
  mongo-data:
  backend-uploads:
