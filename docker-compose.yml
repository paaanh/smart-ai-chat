services:
  # ─── MongoDB ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ─── Backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smart-ai-chat
      - JWT_SECRET=${JWT_SECRET:-smart-ai-jwt-secret-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=http://localhost:80,http://localhost
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - METERED_API_KEY=${METERED_API_KEY:-}
      - METERED_DOMAIN=${METERED_DOMAIN:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  backend-uploads:
